name: Harness contracts
on: [push, pull_request]
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm install --prefix .harness/ci/package-manager --no-save --package-lock=false --ignore-scripts npm@11.9.0
      - run: node .harness/ci/package-manager/node_modules/npm/bin/npm-cli.js ci --ignore-scripts
      - run: node .harness/ci/package-manager/node_modules/npm/bin/npm-cli.js run typecheck
      - run: node .harness/ci/package-manager/node_modules/npm/bin/npm-cli.js test
      - name: Pack consumer distribution
        id: package
        shell: bash
        run: |
          node .harness/ci/package-manager/node_modules/npm/bin/npm-cli.js pack --json > .harness/ci/pack.json
          node --input-type=module -e 'import fs from "node:fs"; const [entry] = JSON.parse(fs.readFileSync(".harness/ci/pack.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${entry.filename}\n`);'
      - name: Validate installed package exports, targets, Skills and acquisition template
        run: node .harness/ci/package-manager/node_modules/npm/bin/npm-cli.js run test:consumer -- --package "${{ steps.package.outputs.tarball }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: contracts-${{ matrix.os }}
          path: |
            *.tgz
            .harness/runs/*/report.json
            .harness/runs/*/junit.xml
            .harness/runs/*/logs/**
          include-hidden-files: true
          if-no-files-found: ignore
