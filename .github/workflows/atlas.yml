name: Atlas survival contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  survival:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CRAFTATLAS_TOKEN_CONFIGURED: ${{ secrets.CRAFTATLAS_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm install --prefix .harness/ci/package-manager --no-save --package-lock=false --ignore-scripts npm@11.9.0
      - run: node .harness/ci/package-manager/node_modules/npm/bin/npm-cli.js ci --ignore-scripts
      - name: Read exact Atlas gitlink
        id: atlas
        run: node .github/scripts/prepare-atlas.mjs --pin
      - name: Read private Atlas with existing repository access
        if: env.CRAFTATLAS_TOKEN_CONFIGURED == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SOL3675/CraftAtlas
          ref: ${{ steps.atlas.outputs.commit }}
          token: ${{ secrets.CRAFTATLAS_READ_TOKEN }}
          path: .harness/ci/atlas-source
          persist-credentials: false
          submodules: false
      - name: Initialize real submodule from authenticated source
        if: env.CRAFTATLAS_TOKEN_CONFIGURED == 'true'
        run: node .github/scripts/prepare-atlas.mjs --source .harness/ci/atlas-source
      - name: Initialize using runner Git access
        if: env.CRAFTATLAS_TOKEN_CONFIGURED != 'true'
        run: node .github/scripts/prepare-atlas.mjs
      - run: node .harness/ci/package-manager/node_modules/npm/bin/npm-cli.js run check:atlas
      - run: node .harness/ci/package-manager/node_modules/npm/bin/npm-cli.js run test:atlas
      - name: Mod definition contract integration through the pinned submodule
        run: node .harness/ci/package-manager/node_modules/npm/bin/npm-cli.js run test:atlas:definitions
      - name: Offline acquisition regression (NeoForge 1.21.1; tests also cover Fabric 1.21.1)
        run: node scripts/atlas-survival.mjs --config tests/atlas/fixtures/suite.json --results .harness/atlas-survival/results.json
      - name: Custom acquisition positive and missing-input regressions
        run: node scripts/atlas-survival.mjs --config tests/atlas-definitions/fixtures/suite.json --results .harness/atlas-survival/custom-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: atlas-survival-${{ matrix.os }}
          path: .harness/atlas-survival/*.json
          include-hidden-files: true
          if-no-files-found: ignore
